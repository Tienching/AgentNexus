[project]
name = "virtual-human-agent"
version = "0.1.0"
description = "Virtual Human Agent - Multi-provider CLI wrapper with AG-UI SSE streaming"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.1",
    "python-json-logger>=2.0.7",
    "httpx>=0.25.2",
    "redis>=5.0.0",
    "sse-starlette>=2.0.0",
    "cryptography>=46.0.5",
    "croniter>=2.0.0",
]

[project.scripts]
vhsdk = "runtime.plugins.cli:main"  # 新的模块化 CLI

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]
wecom = ["websockets>=12.0"]
slack = ["slack-sdk>=3.0.0", "aiohttp>=3.9.0"]
telegram = ["python-telegram-bot>=20.0"]
discord = ["discord.py>=2.3.0"]
whatsapp = ["websockets>=12.0"]
signal = []  # 使用 httpx，已是核心依赖
feishu = []  # 使用 httpx，已是核心依赖
all-channels = [
    "slack-sdk>=3.0.0",
    "aiohttp>=3.9.0",
    "python-telegram-bot>=20.0",
    "discord.py>=2.3.0",
    "websockets>=12.0",
    "httpx>=0.25.2",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/server", "src/runtime", "src/core", "src/providers", "src/protocols"]
omit = ["*/tests/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/server", "src/runtime", "src/core", "src/providers", "src/protocols", "src/channels"]
