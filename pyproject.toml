[project]
name = "agent-nexus"
version = "0.1.0"
description = "Agent Nexus - Multi-provider CLI wrapper with AG-UI SSE streaming"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.1",
    "python-json-logger>=2.0.7",
    "httpx>=0.25.2",
    "qrcode>=7.0",
    "sse-starlette>=2.0.0",
    "cryptography>=46.0.5",
    "croniter>=2.0.0",
    "openai>=2.8.0",
    "tiktoken>=0.12.0",
    "loguru>=0.7.3",
    "mcp>=1.26.0",
    "json-repair>=0.57.0",
    "chardet>=3.0.2",
    "ddgs>=9.5.5",
    "readability-lxml>=0.8.4",
    "pillow>=11.0.0",
]

[project.scripts]
nexus = "runtime.plugins.cli:main"  # canonical CLI entrypoint
anexus = "runtime.plugins.cli:main"  # 新的模块化 CLI

[project.optional-dependencies]
# Keep this `dev` extra aligned with `[dependency-groups].dev`.
# Local bootstrap scripts sync both surfaces so dev/test/runtime entrypoints
# land on the same environment regardless of whether callers use extras or uv groups.
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "playwright>=1.58.0",
]
mission = [
    "redis>=5.0.0",
]
wecom = ["websockets>=12.0"]
slack = ["slack-sdk>=3.0.0", "aiohttp>=3.9.0"]
telegram = ["python-telegram-bot>=20.0"]
discord = ["discord.py>=2.3.0"]
whatsapp = ["websockets>=12.0"]
signal = []  # 使用 httpx，已是核心依赖
feishu = []  # 使用 httpx，已是核心依赖
all-channels = [
    "slack-sdk>=3.0.0",
    "aiohttp>=3.9.0",
    "python-telegram-bot>=20.0",
    "discord.py>=2.3.0",
    "websockets>=12.0",
    "httpx>=0.25.2",
]

[dependency-groups]
# Keep this group aligned with `[project.optional-dependencies].dev`.
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "playwright>=1.58.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.coverage.run]
source = ["src/providers", "src/runtime", "src/server", "src/core", "src/protocols"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 35
show_missing = true
skip_covered = false

[tool.hatch.build.targets.wheel]
packages = ["src/providers", "src/runtime", "src/server", "src/core", "src/protocols"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.omb",
    "/.omc",
    "/.omx",
    "/task.json",
    "/*.zip",
    "/agent-nexus.service",
]

[tool.uv.sources]
