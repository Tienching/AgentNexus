<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusHub - Session Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div id="app" class="flex flex-col h-screen">
        <!-- Header -->
        <header class="bg-gray-800 border-b border-gray-700 px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                        </svg>
                    </div>
                    <h1 class="text-xl font-semibold">NexusHub</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <!-- View Switcher -->
                    <div class="bg-gray-700 border border-gray-600 rounded-lg p-1 flex items-center">
                        <button
                            id="viewChatBtn"
                            class="px-3 py-1.5 rounded-md text-sm font-medium bg-gray-900 text-white"
                        >
                            Chat
                        </button>
                        <button
                            id="viewTaskBtn"
                            class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-300 hover:text-white"
                        >
                            Task
                        </button>
                    </div>

                    <div class="relative" id="usernameFilterWrap">
                        <select 
                            id="usernameFilter" 
                            class="bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 pl-10 w-48 focus:outline-none focus:border-blue-500 text-sm appearance-none cursor-pointer"
                        >
                            <option value="">全部用户</option>
                        </select>
                        <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        <svg class="w-4 h-4 text-gray-400 absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </div>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="搜索会话..." 
                            class="bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 pl-10 w-64 focus:outline-none focus:border-blue-500 text-sm"
                        >
                        <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <button 
                        id="refreshBtn"
                        class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors"
                    >
                        刷新
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-hidden">
            <!-- Chat View -->
            <div id="chatView" class="h-full flex">
                <!-- Session List -->
                <div class="w-80 border-r border-gray-700 overflow-y-auto">
                    <div id="sessionList" class="p-4 space-y-2">
                        <!-- Sessions will be rendered here -->
                        <div class="text-center text-gray-500 py-8">
                            <p>加载中...</p>
                        </div>
                    </div>
                </div>

                <!-- Session Detail -->
                <div class="flex-1 overflow-hidden flex flex-col">
                    <div id="sessionDetail" class="flex-1 overflow-y-auto p-6">
                        <div class="flex items-center justify-center h-full text-gray-500">
                            <div class="text-center">
                                <svg class="w-16 h-16 mx-auto mb-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                                </svg>
                                <p>选择一个会话查看详情</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Task View -->
            <div id="taskView" class="h-full hidden">
                <div class="h-full flex overflow-hidden">
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <div id="taskToolbar" class="border-b border-gray-800 bg-gradient-to-r from-gray-900/60 to-gray-900/20 backdrop-blur"></div>
                        <div class="flex-1 overflow-x-auto overflow-y-hidden">
                            <div id="taskBoard" class="h-full p-4 flex space-x-4 min-w-[1100px]"></div>
                        </div>
                    </div>

                    <div id="taskDetail" class="w-[32rem] border-l border-gray-700 overflow-y-auto p-4 hidden"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4">
            <h3 class="text-lg font-semibold mb-4">确认删除</h3>
            <p id="deleteModalMessage" class="text-gray-400 mb-6">确定要删除这个会话吗？此操作不可撤销。</p>
            <div class="flex justify-end space-x-3">
                <button id="cancelDeleteBtn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors">
                    取消
                </button>
                <button id="confirmDeleteBtn" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg transition-colors">
                    删除
                </button>
            </div>
        </div>
    </div>

    <!-- Create Task Modal -->
    <div id="createTaskModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-gray-800 rounded-lg p-6 max-w-lg w-full mx-4">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold">新建任务</h3>
                <button onclick="app.hideCreateTaskModal()" class="text-gray-400 hover:text-gray-200">✕</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Provider</label>
                    <select id="createTaskProvider" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                        <option value="claude">claude</option>
                        <option value="gemini">gemini</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm text-gray-300 mb-1">描述</label>
                    <textarea id="createTaskDescription" rows="4" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="任务要做什么？"></textarea>
                </div>

                <div>
                    <label class="block text-sm text-gray-300 mb-1">Workspace（可选）</label>
                    <input id="createTaskWorkspace" type="text" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="例如 /path/to/repo" />
                </div>

                <div>
                    <label class="block text-sm text-gray-300 mb-1">Agent（可选）</label>
                    <input id="createTaskAgent" type="text" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="例如 ubuntu" />
                    <div class="text-xs text-gray-500 mt-1">用于任务执行的系统用户（留空则使用默认）。</div>
                </div>
            </div>

            <div class="flex justify-end space-x-3 mt-6">
                <button onclick="app.hideCreateTaskModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors">取消</button>
                <button id="confirmCreateTaskBtn" onclick="app.submitCreateTask()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">创建</button>
            </div>
        </div>
    </div>

    <!-- Error Toast -->
    <div id="errorToast" class="fixed bottom-4 right-4 bg-red-600 text-white px-6 py-3 rounded-lg shadow-lg hidden">
        <p id="errorMessage"></p>
    </div>

    <script src="js/api.js?v=8"></script>
    <script src="js/app.js?v=8"></script>
</body>
</html>
